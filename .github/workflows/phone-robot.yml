name: Phone robot (test site)
# After every push to the test branch: wait until the test site serves the
# pushed app, then drive it like a member on an Android phone (390 / 360 px,
# light and dark). See server/scripts/robot-phone-run.mjs for what it checks.
# Needs six repository secrets (Settings → Secrets and variables → Actions):
#   FITLIFE_ROBOT_MEMBER_PHONE, FITLIFE_ROBOT_MEMBER_PIN,
#   FITLIFE_ROBOT_MEMBER2_PHONE, FITLIFE_ROBOT_MEMBER2_PIN,
#   FITLIFE_ROBOT_COACH_EMAIL, FITLIFE_ROBOT_COACH_PASSWORD
# Without them the run is skipped with a warning. Never point it at production.
on:
  push:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: phone-robot
  cancel-in-progress: true

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install server packages (the browser comes with them)
        working-directory: server
        run: npm install --no-audit --no-fund
      - name: Run the phone robot on fitness-test.up.railway.app
        working-directory: server
        env:
          ROBOT_BASE_URL: https://fitness-test.up.railway.app
          FITLIFE_ROBOT_MEMBER_PHONE: ${{ secrets.FITLIFE_ROBOT_MEMBER_PHONE }}
          FITLIFE_ROBOT_MEMBER_PIN: ${{ secrets.FITLIFE_ROBOT_MEMBER_PIN }}
          FITLIFE_ROBOT_MEMBER2_PHONE: ${{ secrets.FITLIFE_ROBOT_MEMBER2_PHONE }}
          FITLIFE_ROBOT_MEMBER2_PIN: ${{ secrets.FITLIFE_ROBOT_MEMBER2_PIN }}
          FITLIFE_ROBOT_COACH_EMAIL: ${{ secrets.FITLIFE_ROBOT_COACH_EMAIL }}
          FITLIFE_ROBOT_COACH_PASSWORD: ${{ secrets.FITLIFE_ROBOT_COACH_PASSWORD }}
        run: node scripts/robot-phone-run.mjs --wait-for-deploy
      - name: Keep the report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-robot-report
          path: qa/robot-results
          if-no-files-found: ignore
          retention-days: 14
