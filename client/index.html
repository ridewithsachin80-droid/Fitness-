<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0e" />
    <meta name="description" content="FitLife — personalised health tracking" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FitLife" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <!-- Outfit: clean geometric body/UI face. Fraunces: characterful display serif,
         used sparingly for the greeting and big hero numerals (compliance ring,
         calorie totals) to give the app a more considered, premium feel. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&display=swap"
      rel="stylesheet"
    />
    <title>FitLife</title>
    <!-- Inline so a failed CSS load can never flash white — the app is dark. -->
    <style>
      html, body { background: #121316; margin: 0; }
      #boot-fallback { display: none; position: fixed; inset: 0; background: #121316;
        color: #EDEDF0; font-family: system-ui, sans-serif; text-align: center;
        padding: 40vh 24px 0; z-index: 9999; }
      #boot-fallback p { color: #9EA3B0; font-size: 14px; margin: 0 0 20px; }
      #boot-fallback button { background: #D4AF37; color: #121316; border: 0;
        border-radius: 999px; padding: 12px 28px; font-size: 15px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-fallback">
      <p>FitLife couldn't load. This usually clears with a fresh start.</p>
      <button onclick="window.__fitlifeRecover()">Reload app</button>
    </div>
    <script>
      // ── Boot watchdog ──────────────────────────────────────────────────────
      // A PWA can white-screen for reasons the app code never gets to handle:
      // a stale service worker serving an index.html whose hashed chunks were
      // purged by a new deploy, a refresh landing mid-rollout, or a script
      // crash before React mounts. This inline script runs no matter what else
      // fails: if React hasn't painted into #root within 10s, it shows a
      // recovery screen whose button wipes service workers + caches and
      // reloads clean. window.__fitlifeBooted is set by main.jsx after mount.
      window.__fitlifeRecover = async function () {
        try {
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
          }
          if (window.caches && caches.keys) {
            const keys = await caches.keys();
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }
        } catch (e) { /* best effort — reload regardless */ }
        location.reload();
      };
      setTimeout(function () {
        if (!window.__fitlifeBooted) {
          document.getElementById('boot-fallback').style.display = 'block';
        }
      }, 10000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
